services:
  # All-in-One Full-Stack Web Service (Flask + Built React Frontend)
  - type: web
    name: its-playtime-fullstack
    runtime: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "gunicorn --chdir backend app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.0.0
