# Render Blueprint for IT's Playtime
# https://render.com/docs/blueprint-spec

services:
  # 1. Frontend: React + Vite Static Site (100% Free Global CDN)
  - type: web
    name: its-playtime-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: its-playtime-backend
          envVarKey: RENDER_EXTERNAL_URL

  # 2. Backend: Python Flask AI Service with Gunicorn
  - type: web
    name: its-playtime-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
